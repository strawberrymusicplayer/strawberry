syntax = "proto3";

package nw.remote;

option java_multiple_files = true;

enum MsgType {
    MSG_TYPE_UNSPECIFIED = 0;

    // Client message
    MSG_TYPE_REQUEST_SONG_INFO = 1;
    MSG_TYPE_REQUEST_PLAY = 2;
    MSG_TYPE_REQUEST_NEXT = 3;
    MSG_TYPE_REQUEST_PREVIOUS = 4;
    MSG_TYPE_REQUEST_PAUSE = 5;
    MSG_TYPE_REQUEST_STOP = 6;
    MSG_TYPE_REQUEST_FINISH = 7;


    // Server messages
    MSG_TYPE_REPLY_SONG_INFO = 8;
    MSG_TYPE_REPLY_PLAY = 9;
    MSG_TYPE_REPLY_NEXT = 10;
    MSG_TYPE_REPLY_PREVIOUS = 11;
    MSG_TYPE_REPLY_PAUSE = 12;
    MSG_TYPE_REPLY_STOP = 13;
    MSG_TYPE_REPLY_FINISH = 14;
    MSG_TYPE_ENGINE_STATE_CHANGE = 15;

    // Bidirectional messages
    MSG_TYPE_DISCONNECT = 16;

    // Connection handshake
    MSG_TYPE_REQUEST_CONNECT = 17;
    MSG_TYPE_RESPONSE_CONNECT = 18;

    // Initial state, song and playlist
    MSG_TYPE_REQUEST_INITIAL_INFO = 19;
    MSG_TYPE_RESPONSE_INITIAL_INFO = 20;

    // Playlist songs (queue view)
    MSG_TYPE_REQUEST_PLAYLIST_SONGS = 21;
    MSG_TYPE_RESPONSE_PLAYLIST_SONGS = 22;

    // Play a specific song within a playlist
    MSG_TYPE_REQUEST_PLAY_SONG = 23;
    MSG_TYPE_RESPONSE_PLAY_SONG = 24;

    // Add current song to a playlist (existing or newly created)
    MSG_TYPE_REQUEST_ADD_SONG_TO_PLAYLIST = 25;
    MSG_TYPE_RESPONSE_ADD_SONG_TO_PLAYLIST = 26;

    // Remove a song from a playlist
    MSG_TYPE_REQUEST_REMOVE_SONG_FROM_PLAYLIST = 27;
    MSG_TYPE_RESPONSE_REMOVE_SONG_FROM_PLAYLIST = 28;

    // Server-initiated broadcasts (sent to all connected clients, not just the requester)
    MSG_TYPE_PLAYLIST_CHANGED = 29;
    MSG_TYPE_PLAYLIST_ACTIVATED = 30;
}

enum PlayerState {
    PLAYER_STATUS_UNSPECIFIED = 0;
    PLAYER_STATUS_EMPTY = 1;
    PLAYER_STATUS_IDLE = 2;
    PLAYER_STATUS_PLAYING = 3;
    PLAYER_STATUS_PAUSED = 4;
    PLAYER_STATUS_ERROR = 5;
}

enum EngineState {
    ENGINE_STATE_EMPTY = 0;
    ENGINE_STATE_IDLE = 1;
    ENGINE_STATE_PLAYING = 2;
    ENGINE_STATE_PAUSED = 3;
}

enum ReasonDisconnect {
    REASON_DISCONNECT_SERVER_SHUTDOWN = 0;
    REASON_DISCONNECT_CLIENT_SHUTDOWN = 1;
    REASON_DISCONNECT_VERSION_MISMATCH = 2;
    REASON_DISCONNECT_UNKNOWN_MSGTYPE = 3;
    REASON_DISCONNECT_NO_HANDSHAKE = 4;
    REASON_DISCONNECT_TOO_MANY_FAILED_ATTEMPTS = 5;
}

enum PlaylistRejectReason {
    PLAYLIST_REJECT_NONE = 0;            // accepted=true, ignore this field
    PLAYLIST_REJECT_INVALID_REQUEST = 1; // e.g. bad row index, no current song, unknown playlist
    PLAYLIST_REJECT_TOKEN_MISMATCH = 2;  // auth enabled, client sent a token, but it didn't match
    PLAYLIST_REJECT_TOKEN_REQUIRED = 3;  // auth enabled, client sent no/empty token
}

message RequestDisconnect {
    ReasonDisconnect reason_disconnect = 1;
}

message RequestConnect {
    string client_name = 1;
}

message ResponseConnect {
    bool accepted = 1;
    bool auth_enabled = 2;
}

message SongMetadata{
    uint32 id = 1;
    string title = 2;
    string album = 3;
    string artist = 4;
    string albumartist = 5;
    uint32 track = 6;
    string stryear = 7;
    string genre = 8;
    uint32 playcount = 9;
    string songlength = 10;
}
message RequestSongMetadata {
    bool send = 1;
}

message ResponseSongMetadata {
    SongMetadata song_metadata = 1;
    PlayerState player_state = 2;
    uint32 position_seconds = 3;
    uint32 length_seconds = 4;
}

message RequestNextTrack {
    bool next = 1;
}

message ResponseNextTrack {
    bool next = 1;
}

message RequestPreviousTrack {
    bool previous = 1;
}

message ResponsePreviousTrack {
    bool previous = 1;
}

message RequestPlay {
    bool play = 1;
}

message ResponsePlay {
    bool play = 1;
}

message RequestPause {
    bool pause = 1;
}

message ResponsePause {
    bool pause = 1;
}

message RequestStop {
    bool stop = 1;
}

message EngineStateChange {
    EngineState state = 1;
}

message PlaylistInfo {
    uint32 id = 1;
    string name = 2;
    uint32 item_count = 3;
    bool is_open = 4;
    bool is_playing = 5;
}

message ResponsePlaylists {
    repeated PlaylistInfo playlists = 1;
}

message RequestInitialInfo {
    bool send = 1;
}

message ResponseInitialInfo {
    ResponseSongMetadata song_info = 1;
    ResponsePlaylists playlists = 2;
    EngineStateChange engine_state = 3;
}

message RequestPlaylistSongs {
    uint32 playlist_id = 1;
    uint32 upcoming_count = 2;
}

// One visible column's identity, sent once per ResponsePlaylistSongs rather
// than re-sent per cell. is_numeric reflects the server's own knowledge of
// the underlying Playlist::Column (Track, Year, Length, PlayCount, etc. are
// numeric/measurement-like; Title, Artist, Album, Genre etc. are text) -
// clients use it to decide left vs. center alignment without having to guess
// from formatted cell content.
message ColumnInfo {
    string name = 1;
    bool is_numeric = 2;
}

message PlaylistSongRow {
    repeated string values = 1;   // positionally aligned with ResponsePlaylistSongs.columns
    uint32 row_index = 2;         // absolute row position within the playlist; needed for play/remove
}

message ResponsePlaylistSongs {
    uint32 playlist_id = 1;
    repeated ColumnInfo columns = 2;      // visible desktop columns, left-to-right order
    repeated PlaylistSongRow rows = 3;    // rows[0] = this playlist's current/last-played row; rows[1..] = upcoming
    bool is_active = 4;                   // true only if this playlist is actually producing audio right now
}

message RequestPlaySong {
    uint32 playlist_id = 1;
    uint32 row_index = 2;
}

message ResponsePlaySong {
    bool accepted = 1;
}

message RequestAddSongToPlaylist {
    uint32 target_playlist_id = 1;  // ignored if new_playlist_name is set
    string new_playlist_name = 2;   // non-empty => create playlist, use as target
    string token = 3;
}

message ResponseAddSongToPlaylist {
    bool accepted = 1;
    uint32 playlist_id = 2;         // resolved id (existing or newly created)
    PlaylistRejectReason reject_reason = 3;
}

message RequestRemoveSongFromPlaylist {
    uint32 playlist_id = 1;
    uint32 row_index = 2;
    string token = 3;
}

message ResponseRemoveSongFromPlaylist {
    bool accepted = 1;
    PlaylistRejectReason reject_reason = 2;
}

message PlaylistChanged {
    uint32 playlist_id = 1;
}

message PlaylistActivated {
    uint32 playlist_id = 1;
}

message Message {
    MsgType type = 1;
    uint32 version = 15;
    oneof payload {
        RequestSongMetadata request_song_metadata = 2;
        ResponseSongMetadata response_song_metadata = 3;
        RequestNextTrack request_next_track = 4;
        RequestPreviousTrack request_previous_track = 5;
        RequestPlay request_play = 6;
        RequestPause request_pause = 7;
        RequestStop request_stop = 8;
        EngineStateChange engine_state_change = 9;
        RequestDisconnect request_disconnect = 10;
        ResponseNextTrack response_next_track = 11;
        ResponsePreviousTrack response_previous_track = 12;
        ResponsePlay response_play = 13;
        ResponsePause response_pause = 14;
        RequestConnect request_connect = 16;
        ResponseConnect response_connect = 17;
        RequestInitialInfo request_initial_info = 18;
        ResponseInitialInfo response_initial_info = 19;
        RequestPlaylistSongs request_playlist_songs = 20;
        ResponsePlaylistSongs response_playlist_songs = 21;
        RequestPlaySong request_play_song = 22;
        ResponsePlaySong response_play_song = 23;
        RequestAddSongToPlaylist request_add_song_to_playlist = 24;
        ResponseAddSongToPlaylist response_add_song_to_playlist = 25;
        RequestRemoveSongFromPlaylist request_remove_song_from_playlist = 26;
        ResponseRemoveSongFromPlaylist response_remove_song_from_playlist = 27;
        PlaylistChanged playlist_changed = 28;
        PlaylistActivated playlist_activated = 29;
    }
}